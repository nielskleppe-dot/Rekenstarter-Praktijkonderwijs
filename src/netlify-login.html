<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Docentenlogin · Rekenstart</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f6f9;color:#392348;font:17px/1.55 system-ui,sans-serif}main{width:min(100%,480px);padding:36px;background:white;border:1px solid #e5ddeb;border-radius:18px;box-shadow:0 12px 40px #3923480a}img{display:block;width:190px;height:95px;object-fit:contain;margin:0 auto 24px}h1{font-size:30px;line-height:1.2;margin:0 0 14px}p{color:#6a5876}label{display:grid;gap:7px;margin:20px 0;font-weight:650}input,button{font:inherit;border-radius:9px;padding:12px 14px;width:100%}input{border:1px solid #bdaacb}input:focus-visible{outline:3px solid #d9c6e7;outline-offset:2px}button{margin-top:8px;border:0;background:#522776;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#522776;text-underline-offset:4px}.back{display:inline-block;margin-top:22px}#login-status{min-height:3em;background:#f5f0f8;padding:12px 14px;border-radius:9px;font-size:15px}[hidden]{display:none!important}
</style></head><body><main><img src="/assets/school-logo.png" alt="CSG Prins Maurits · Praktijkonderwijs"><h1 id="login-heading">Docentenlogin</h1><p>Log in om werkkaarten te bewaren en de praktijkassistent te gebruiken.</p><form id="login-form"><label id="login-email-field">E-mailadres<input id="login-email" type="email" autocomplete="username" required maxlength="254"></label><label>Wachtwoord<input id="login-password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="login-submit" type="submit">Inloggen</button><button id="login-forgot" type="button">Wachtwoord vergeten?</button></form><p id="login-status" role="status" aria-live="polite">Inlog laden…</p><a class="back" href="/">Terug naar de lessen</a></main><script type="module" src="/assets/auth-client.js"></script></body></html>
